<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>ניהול - BDSM Chat</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@200;300;400;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { font-family: 'Assistant', sans-serif; }
    body { margin: 0; background: #000; color: #fff; }
    .glass { background: rgba(10,10,10,0.7); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.07); }
    .loader { display:flex; align-items:center; justify-content:center; height:100vh; color:#888; flex-direction:column; gap:16px; }
    .spinner { width:40px; height:40px; border:3px solid #333; border-top-color:#cc0000; border-radius:50%; animation:spin 1s linear infinite; }
    @keyframes spin { to { transform:rotate(360deg); } }
    @media (max-width:767px) { input,textarea { font-size:16px !important; } }
  </style>
</head>
<body>
<div id="root"><div class="loader"><div class="spinner"></div><div>טוען פאנל ניהול...</div></div></div>

<script crossorigin src="https://unpkg.com/react@18.2.0/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18.2.0/umd/react-dom.production.min.js"></script>

<script type="module">
  const { initializeApp } = await import('https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js');
  const {
    getFirestore, collection, query, where, onSnapshot,
    deleteDoc, doc, setDoc, getDoc, getDocs, serverTimestamp, addDoc, writeBatch
  } = await import('https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js');

  const cfg = {
    apiKey: "AIzaSyAJv0APn-Qmv59H2Behu3PhskObCaPHW_A",
    authDomain: "tbdsm-5acca.firebaseapp.com",
    projectId: "tbdsm-5acca",
    storageBucket: "tbdsm-5acca.firebasestorage.app",
    messagingSenderId: "905865425928",
    appId: "1:905865425928:web:1898ebb5b8de87ecf3cdbd"
  };
  const app = initializeApp(cfg);
  const db  = getFirestore(app);
  const nickKey = n => String(n).trim().toLowerCase().replace(/[\/\\\s\.\#\$\[\]]/g,'_');
  const ONLINE_CUTOFF = 45 * 1000; // 45 seconds

  // ── Firebase helpers ──────────────────────────────────────────────
  window.adminSubscribeMessages = cb => {
    return onSnapshot(collection(db,'chatMessages'), snap => {
      const msgs = snap.docs.map(d=>({...d.data(),_id:d.id}));
      msgs.sort((a,b)=>(b.createdAt?.seconds||0)-(a.createdAt?.seconds||0));
      cb(msgs);
    });
  };

  window.adminSubscribeOnline = cb => {
    return onSnapshot(collection(db,'chatNicknames'), snap => {
      const cut = Date.now() - ONLINE_CUTOFF;
      cb(snap.docs.map(d=>({...d.data(),_id:d.id})).filter(u=>u.lastSeenAt?.seconds*1000>cut));
    });
  };

  window.adminSubscribeBans = cb =>
    onSnapshot(collection(db,'chatBans'), snap => cb(snap.docs.map(d=>({...d.data(),_id:d.id}))));

  window.adminSubscribePinned = cb =>
    onSnapshot(doc(db,'chatPinned','current'), snap => cb(snap.exists()?snap.data():null));

  window.adminSubscribeRooms = cb =>
    onSnapshot(collection(db,'chatRooms'), snap => {
      const rooms = snap.docs.map(d=>({...d.data(),_id:d.id}));
      rooms.sort((a,b)=>(a.order||99)-(b.order||99));
      cb(rooms);
    });

  window.adminSubscribeParty = cb =>
    onSnapshot(doc(db,'chatSettings','party'), snap => cb(snap.exists()?snap.data():null));

  window.adminDeleteMessage = id => deleteDoc(doc(db,'chatMessages',id));

  window.adminClearAllMessages = async () => {
    const snap = await getDocs(collection(db,'chatMessages'));
    const batch = writeBatch(db);
    snap.docs.forEach(d => batch.delete(d.ref));
    await batch.commit();
    return snap.docs.length;
  };

  window.adminClearRoom = async room => {
    const snap = await getDocs(query(collection(db,'chatMessages'),where('room','==',room)));
    const batch = writeBatch(db);
    snap.docs.forEach(d => batch.delete(d.ref));
    await batch.commit();
    return snap.docs.length;
  };

  window.adminBanNickname = async (nickname, reason) => {
    const key = nickKey(nickname);
    await setDoc(doc(db,'chatBans',key), { nickname, reason:reason||'', bannedAt:serverTimestamp() });
    try { await deleteDoc(doc(db,'chatNicknames',key)); } catch(e){}
  };

  window.adminUnbanNickname = async nickname => deleteDoc(doc(db,'chatBans',nickKey(nickname)));

  window.adminKickUser = async nickname => deleteDoc(doc(db,'chatNicknames',nickKey(nickname)));

  window.adminPinMessage = async text =>
    setDoc(doc(db,'chatPinned','current'), { text:text||'', pinnedAt:serverTimestamp() });

  window.adminUnpinMessage = () => deleteDoc(doc(db,'chatPinned','current'));

  window.adminAddRoom = async (name, icon, description) => {
    const snap = await getDocs(collection(db,'chatRooms'));
    const order = snap.docs.length;
    await addDoc(collection(db,'chatRooms'), { name, icon:icon||'💬', description:description||'', order, createdAt:serverTimestamp() });
  };

  window.adminDeleteRoom = id => deleteDoc(doc(db,'chatRooms',id));

  window.adminSetParty = async (active, text, date) => {
    await setDoc(doc(db,'chatSettings','party'), { active:!!active, text:text||'', date:date||'', updatedAt:serverTimestamp() });
  };

  window.adminLog = async action =>
    addDoc(collection(db,'chatAdminLogs'), { action, at:serverTimestamp() });

  window.adminReady = true;
  window.dispatchEvent(new Event('admin-ready'));
</script>

<script>
function ready(fn) {
  if (window.adminReady) fn(); else window.addEventListener('admin-ready', fn, {once:true});
}

ready(function() {
  const { useState, useEffect, useRef } = React;
  const e = React.createElement;

  // ── Login ─────────────────────────────────────────────────────────
  function Login({ onSuccess }) {
    const [user, setUser] = useState('');
    const [pass, setPass] = useState('');
    const [err,  setErr]  = useState('');
    const go = () => {
      if (user === 'admin' && pass === '2109') {
        try { sessionStorage.setItem('admin_ok','1'); } catch(e){}
        onSuccess();
      } else setErr('שם משתמש או סיסמה שגויים');
    };
    return e('div', { className:'min-h-screen bg-black flex items-center justify-center p-4' },
      e('div', { className:'glass p-8 rounded-3xl max-w-md w-full' },
        e('div', { className:'text-center mb-8' },
          e('div', { className:'text-5xl font-black italic', style:{color:'#CC0000'} }, '🛡️ ניהול'),
          e('div', { className:'text-gray-400 text-sm mt-2' }, 'פאנל ניהול מדברים בדסמ')
        ),
        e('div', { className:'space-y-4' },
          e('input', { type:'text', placeholder:'שם משתמש', value:user, onChange:ev=>setUser(ev.target.value),
            onKeyPress:ev=>ev.key==='Enter'&&go(),
            className:'w-full px-5 py-4 bg-black/50 border border-red-600/30 rounded-xl text-white text-right focus:outline-none focus:border-red-500' }),
          e('input', { type:'password', placeholder:'סיסמה', value:pass, onChange:ev=>setPass(ev.target.value),
            onKeyPress:ev=>ev.key==='Enter'&&go(),
            className:'w-full px-5 py-4 bg-black/50 border border-red-600/30 rounded-xl text-white text-right focus:outline-none focus:border-red-500' }),
          err && e('div', { className:'text-red-400 text-sm text-right' }, '⚠️ ' + err),
          e('button', { onClick:go, className:'w-full py-4 bg-red-600 hover:bg-red-700 rounded-xl font-bold text-lg' }, 'כניסה')
        ),
        e('div', { className:'text-center mt-6' },
          e('a', { href:'/', className:'text-gray-500 hover:text-white text-sm' }, "← חזרה לצ'אט"))
      )
    );
  }

  // ── Dashboard ─────────────────────────────────────────────────────
  function Dashboard() {
    const [tab,    setTab]    = useState('dashboard');
    const [msgs,   setMsgs]   = useState([]);
    const [online, setOnline] = useState([]);
    const [bans,   setBans]   = useState([]);
    const [pinned, setPinned] = useState(null);
    const [pinTxt, setPinTxt] = useState('');
    const [rooms,  setRooms]  = useState([]);
    const [party,  setParty]  = useState(null);
    const [menu,   setMenu]   = useState(false);
    // room form
    const [rName, setRName]   = useState('');
    const [rIcon, setRIcon]   = useState('');
    const [rDesc, setRDesc]   = useState('');
    // party form
    const [pActive, setPActive] = useState(false);
    const [pText,   setPText]   = useState('');
    const [pDate,   setPDate]   = useState('');

    useEffect(() => {
      const u1 = window.adminSubscribeMessages(setMsgs);
      const u2 = window.adminSubscribeOnline(setOnline);
      const u3 = window.adminSubscribeBans(setBans);
      const u4 = window.adminSubscribePinned(p => { setPinned(p); setPinTxt(p?.text||''); });
      const u5 = window.adminSubscribeRooms(setRooms);
      const u6 = window.adminSubscribeParty(p => {
        setParty(p);
        if (p) { setPActive(p.active||false); setPText(p.text||''); setPDate(p.date||''); }
      });
      return () => { u1();u2();u3();u4();u5();u6(); };
    }, []);

    const logout = () => { try{sessionStorage.removeItem('admin_ok');}catch(e){} window.location.reload(); };

    const enterChat = nick => {
      const token = 'adm_'+Date.now()+'_'+Math.random().toString(36).slice(2);
      try { localStorage.setItem('admin_chat_token', JSON.stringify({token,nick,expires:Date.now()+5*60*1000})); } catch(e){}
      const url = '/?adminNick='+encodeURIComponent(nick)+'&token='+token;
      if (!window.open(url,'_blank')) window.location.href = url;
    };

    const delMsg = async msg => {
      if (!confirm('למחוק הודעה?')) return;
      await window.adminDeleteMessage(msg._id);
      await window.adminLog('מחק הודעה מ-'+(msg.realUser||msg.user));
    };

    const banUser = async user => {
      const nick = user.realUser||user.user||user.nickname;
      if (!nick) return;
      const reason = prompt('סיבת חסימה של '+nick+':','');
      if (reason===null) return;
      await window.adminBanNickname(nick, reason);
      await window.adminLog('חסם: '+nick);
      alert('נחסם: '+nick);
    };

    const unban = async nick => {
      if (!confirm('לבטל חסימת "'+nick+'"?')) return;
      await window.adminUnbanNickname(nick);
      await window.adminLog('ביטל חסימה: '+nick);
    };

    const kick = async nick => {
      if (!confirm('לבעוט את "'+nick+'"?')) return;
      await window.adminKickUser(nick);
      await window.adminLog('בעט: '+nick);
    };

    const clearAll = async () => {
      if (!confirm("⚠️ מחיקת כל ההודעות!\nפעולה זו לא ניתנת לביטול. להמשיך?")) return;
      if (!confirm('בטוח לגמרי?')) return;
      const n = await window.adminClearAllMessages();
      await window.adminLog('מחק כל הצ\'אט ('+n+' הודעות)');
      alert('נמחקו '+n+' הודעות');
    };

    const clearRoom = async room => {
      if (!confirm('למחוק את כל הודעות החדר "'+room+'"?')) return;
      const n = await window.adminClearRoom(room);
      await window.adminLog('מחק חדר '+room+' ('+n+' הודעות)');
      alert('נמחקו '+n+' הודעות מחדר '+room);
    };

    const doPin = async () => {
      if (!pinTxt.trim()) { alert('הזן טקסט'); return; }
      await window.adminPinMessage(pinTxt.trim());
      await window.adminLog('נעץ הודעה');
      alert('ההודעה נעוצה לכולם!');
    };

    const doUnpin = async () => {
      if (!confirm('להסיר הודעה נעוצה?')) return;
      await window.adminUnpinMessage();
      await window.adminLog('הסיר הודעה נעוצה');
    };

    const addRoom = async () => {
      if (!rName.trim()) { alert('הזן שם חדר'); return; }
      await window.adminAddRoom(rName.trim(), rIcon.trim(), rDesc.trim());
      await window.adminLog('הוסיף חדר: '+rName);
      setRName(''); setRIcon(''); setRDesc('');
      alert('החדר "'+rName+'" נוסף!');
    };

    const delRoom = async (id, name) => {
      if (!confirm('למחוק את החדר "'+name+'"?\nהודעות בחדר לא יימחקו.')) return;
      await window.adminDeleteRoom(id);
      await window.adminLog('מחק חדר: '+name);
    };

    const saveParty = async () => {
      await window.adminSetParty(pActive, pText, pDate);
      await window.adminLog((pActive?'הפעיל':'כיבה')+' הכרזת מסיבה');
      alert('נשמר!');
    };

    const todayMsgs = msgs.filter(m=>m.createdAt?.seconds&&(Date.now()-m.createdAt.seconds*1000)<86400000).length;
    const byRoom = {};
    msgs.forEach(m=>{ byRoom[m.room||'כללי']=(byRoom[m.room||'כללי']||0)+1; });

    // ── Sidebar nav items ──
    const navItems = [
      { id:'dashboard', label:'📊 דשבורד' },
      { id:'online',    label:'🟢 מחוברים ('+online.length+')' },
      { id:'messages',  label:'💬 הודעות ('+msgs.length+')' },
      { id:'rooms',     label:'🚪 חדרים ('+rooms.length+')' },
      { id:'party',     label:'🎉 מסיבות' },
      { id:'pinned',    label:'📌 הודעה נעוצה' },
      { id:'bans',      label:'🚫 חסומים ('+bans.length+')' },
    ];

    const btn = (label, onClick, color='bg-red-600 hover:bg-red-700') =>
      e('button', { onClick, className:`px-4 py-2 ${color} text-white rounded-lg text-sm font-semibold transition-all` }, label);

    return e('div', { className:'min-h-screen bg-black text-white flex flex-col md:flex-row' },

      // Mobile topbar
      e('div', { className:'md:hidden sticky top-0 z-40 bg-black/90 backdrop-blur border-b border-red-600/20 px-4 py-3 flex items-center justify-between' },
        e('div', { className:'text-xl font-black italic', style:{color:'#CC0000'} }, '🛡️ ניהול'),
        e('button', { onClick:()=>setMenu(!menu), className:'p-2 glass rounded-lg' }, '☰')
      ),

      menu && e('div', { onClick:()=>setMenu(false), className:'md:hidden fixed inset-0 bg-black/70 z-40' }),

      // Sidebar
      e('div', { className:'fixed md:static top-0 right-0 h-screen w-64 bg-black/95 border-l border-red-600/20 p-5 flex flex-col z-50 transform transition-transform duration-300 '+(menu?'translate-x-0':'translate-x-full md:translate-x-0') },
        e('div', { className:'text-2xl font-black italic mb-1', style:{color:'#CC0000'} }, '🛡️ ניהול'),
        e('div', { className:'text-gray-500 text-xs mb-6' }, 'מחובר כאדמין'),
        e('nav', { className:'flex-1 space-y-1 overflow-y-auto' },
          navItems.map(t => e('button', {
            key:t.id, onClick:()=>{setTab(t.id);setMenu(false);},
            className:'w-full px-4 py-3 text-right rounded-xl transition-all '+(tab===t.id?'bg-red-600 text-white font-bold':'text-gray-300 hover:bg-white/5')
          }, t.label))
        ),
        e('div', { className:'border-t border-red-600/20 pt-4 space-y-2 mt-4' },
          e('a', { href:'/', className:'block text-center py-2 text-gray-400 hover:text-white text-sm' }, "← חזרה לצ'אט"),
          e('button', { onClick:logout, className:'w-full py-2 bg-black/60 hover:bg-red-900/40 text-white rounded-xl text-sm border border-red-600/20' }, 'התנתק')
        )
      ),

      // Main content
      e('div', { className:'flex-1 p-4 md:p-8 overflow-y-auto' },

        // ── DASHBOARD ──
        tab==='dashboard' && e('div', null,
          e('h1', { className:'text-3xl font-bold mb-6' }, 'דשבורד'),

          // Enter chat
          e('div', { className:'glass rounded-2xl p-6 mb-6 border border-yellow-500/30 bg-gradient-to-br from-yellow-900/10 to-amber-900/10' },
            e('h2', { className:'text-xl font-bold text-yellow-300 mb-4' }, "👑 כניסה לצ'אט כמנהל"),
            e('div', { className:'grid grid-cols-2 gap-3' },
              ['aizik love','miss chen'].map(nick =>
                e('button', { key:nick, onClick:()=>enterChat(nick),
                  className:'py-4 bg-gradient-to-br from-yellow-600 to-amber-700 hover:from-yellow-500 hover:to-amber-600 rounded-xl font-bold flex items-center justify-center gap-2' },
                  e('span',null,'👑'), e('span',null,'כנס כ-'+nick)
                )
              )
            )
          ),

          // Stats
          e('div', { className:'grid grid-cols-2 md:grid-cols-4 gap-4 mb-6' },
            [
              {label:'מחוברים עכשיו', value:online.length, color:'from-green-600 to-emerald-700'},
              {label:'הודעות היום',   value:todayMsgs,    color:'from-blue-600 to-cyan-700'},
              {label:"סה\"כ הודעות", value:msgs.length,   color:'from-purple-600 to-pink-700'},
              {label:'חסומים',        value:bans.length,  color:'from-red-600 to-orange-700'},
            ].map((s,i) => e('div', { key:i, className:'bg-gradient-to-br '+s.color+' rounded-2xl p-5' },
              e('div', { className:'text-4xl font-bold' }, s.value),
              e('div', { className:'text-sm opacity-80 mt-1' }, s.label)
            ))
          ),

          // Messages by room
          e('div', { className:'glass rounded-2xl p-5' },
            e('h2', { className:'font-bold text-lg mb-4' }, 'הודעות לפי חדר'),
            Object.keys(byRoom).length===0
              ? e('div', { className:'text-gray-500 text-center py-4' }, 'אין עדיין הודעות')
              : Object.entries(byRoom).map(([room,cnt]) =>
                  e('div', { key:room, className:'flex justify-between items-center py-2 border-b border-white/5' },
                    e('span', { className:'text-gray-300' }, room),
                    e('div', { className:'flex items-center gap-3' },
                      e('span', { className:'font-bold text-red-400' }, cnt),
                      btn('נקה', ()=>clearRoom(room), 'bg-gray-700 hover:bg-red-600')
                    )
                  )
                )
          )
        ),

        // ── ONLINE USERS ──
        tab==='online' && e('div', null,
          e('h1', { className:'text-3xl font-bold mb-6' }, '🟢 משתמשים מחוברים'),
          online.length===0
            ? e('div', { className:'text-gray-500 text-center py-16 text-lg' }, 'אין משתמשים מחוברים כרגע')
            : e('div', { className:'grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4' },
                online.map(u => e('div', { key:u._id, className:'glass rounded-xl p-5' },
                  e('div', { className:'flex items-center gap-3 mb-4' },
                    e('div', { className:'w-3 h-3 bg-green-500 rounded-full animate-pulse' }),
                    e('div', { className:'font-bold text-lg' }, u.nickname),
                    u.isAdmin && e('span', { className:'text-xs bg-yellow-400 text-black px-2 py-0.5 rounded font-black' }, 'מנהל')
                  ),
                  e('div', { className:'flex items-center gap-2 mb-4' },
                    e('div', { className:'w-2 h-2 bg-green-500 rounded-full animate-pulse' }),
                    e('span', { className:'text-green-400 text-sm font-semibold' }, 'מחובר עכשיו')
                  ),
                  e('div', { className:'flex gap-2' },
                    e('button', { onClick:()=>kick(u.nickname),
                      className:'flex-1 py-2 bg-yellow-600/20 hover:bg-yellow-600 text-yellow-200 hover:text-white rounded-lg text-sm transition-all' }, '👢 בעט'),
                    e('button', { onClick:()=>banUser(u),
                      className:'flex-1 py-2 bg-red-600/20 hover:bg-red-600 text-red-200 hover:text-white rounded-lg text-sm transition-all' }, '🚫 חסום')
                  )
                ))
              )
        ),

        // ── MESSAGES ──
        tab==='messages' && e('div', null,
          e('div', { className:'flex items-center justify-between mb-6' },
            e('h1', { className:'text-3xl font-bold' }, '💬 כל ההודעות'),
            msgs.length>0 && e('button', { onClick:clearAll,
              className:'px-5 py-3 bg-red-600 hover:bg-red-700 rounded-xl text-sm font-bold flex items-center gap-2' },
              "🗑️ מחק את כל הצ'אט")
          ),
          msgs.length===0
            ? e('div', { className:'text-gray-500 text-center py-16' }, 'אין הודעות')
            : e('div', { className:'space-y-2' },
                msgs.map(msg => e('div', { key:msg._id, className:'glass rounded-xl p-4 flex flex-col sm:flex-row gap-3 items-start' },
                  e('div', { className:'flex-1 min-w-0' },
                    e('div', { className:'flex flex-wrap items-center gap-2 mb-1' },
                      e('span', { className:'font-bold text-red-400' }, msg.user||'?'),
                      msg.realUser && msg.realUser!==msg.user && e('span', { className:'text-gray-500 text-xs' }, '('+msg.realUser+')'),
                      e('span', { className:'text-gray-500 text-xs' }, '· '+( msg.room||'כללי')+' · '+(msg.timestamp||''))
                    ),
                    msg.imageUrl
                      ? e('img', { src:msg.imageUrl, style:{maxWidth:'120px',borderRadius:'8px',marginTop:'4px'} })
                      : e('div', { className:'text-white text-sm break-words' }, msg.text)
                  ),
                  e('div', { className:'flex gap-2 flex-shrink-0' },
                    e('button', { onClick:()=>delMsg(msg),
                      className:'px-3 py-1.5 bg-red-600/20 hover:bg-red-600 rounded-lg text-xs transition-all' }, '🗑️ מחק'),
                    e('button', { onClick:()=>banUser(msg),
                      className:'px-3 py-1.5 bg-orange-600/20 hover:bg-orange-600 rounded-lg text-xs transition-all' }, '🚫 חסום')
                  )
                ))
              )
        ),

        // ── ROOMS ──
        tab==='rooms' && e('div', null,
          e('h1', { className:'text-3xl font-bold mb-6' }, '🚪 ניהול חדרים'),

          // Add room form
          e('div', { className:'glass rounded-2xl p-6 mb-6 border border-green-600/20' },
            e('h2', { className:'font-bold text-lg mb-4 text-green-400' }, '➕ הוסף חדר חדש'),
            e('div', { className:'grid grid-cols-1 md:grid-cols-3 gap-3 mb-4' },
              e('input', { type:'text', placeholder:'שם החדר (חובה)', value:rName, onChange:ev=>setRName(ev.target.value),
                className:'px-4 py-3 bg-black/50 border border-white/10 rounded-xl text-white text-right focus:outline-none focus:border-green-500' }),
              e('input', { type:'text', placeholder:'אימוג\'י (למשל 🎉)', value:rIcon, onChange:ev=>setRIcon(ev.target.value),
                className:'px-4 py-3 bg-black/50 border border-white/10 rounded-xl text-white text-right focus:outline-none focus:border-green-500' }),
              e('input', { type:'text', placeholder:'תיאור קצר', value:rDesc, onChange:ev=>setRDesc(ev.target.value),
                className:'px-4 py-3 bg-black/50 border border-white/10 rounded-xl text-white text-right focus:outline-none focus:border-green-500' })
            ),
            e('button', { onClick:addRoom,
              className:'px-6 py-3 bg-green-600 hover:bg-green-700 rounded-xl font-bold' }, '➕ הוסף חדר')
          ),

          // Rooms list
          rooms.length===0
            ? e('div', { className:'text-gray-500 text-center py-8' }, 'אין חדרים מותאמים אישית עדיין — משתמשים רואים את חדרי ברירת המחדל')
            : e('div', { className:'space-y-3' },
                rooms.map(r => e('div', { key:r._id, className:'glass rounded-xl p-4 flex items-center justify-between' },
                  e('div', { className:'flex items-center gap-3' },
                    e('span', { className:'text-2xl' }, r.icon||'💬'),
                    e('div', null,
                      e('div', { className:'font-bold' }, r.name),
                      r.description && e('div', { className:'text-gray-400 text-sm' }, r.description)
                    )
                  ),
                  e('div', { className:'flex gap-2' },
                    e('button', { onClick:()=>clearRoom(r.name),
                      className:'px-3 py-1.5 bg-gray-700 hover:bg-gray-600 rounded-lg text-sm' }, '🧹 נקה'),
                    e('button', { onClick:()=>delRoom(r._id,r.name),
                      className:'px-3 py-1.5 bg-red-600/30 hover:bg-red-600 rounded-lg text-sm' }, '🗑️ מחק')
                  )
                ))
              )
        ),

        // ── PARTY ──
        tab==='party' && e('div', null,
          e('h1', { className:'text-3xl font-bold mb-2' }, '🎉 הכרזת מסיבה'),
          e('p', { className:'text-gray-400 mb-6' }, "הכרזה שתופיע בראש הצ'אט בחמישי ושישי (או בכל זמן שתרצה)"),

          e('div', { className:'glass rounded-2xl p-6 space-y-5' },
            e('div', { className:'flex items-center gap-4 p-4 bg-black/40 rounded-xl' },
              e('div', { className:'flex-1' },
                e('div', { className:'font-bold text-lg mb-1' }, 'הפעלת הכרזה'),
                e('div', { className:'text-gray-400 text-sm' }, 'כשמופעל — ההכרזה תופיע לכולם')
              ),
              e('button', { onClick:()=>setPActive(!pActive),
                className:'w-16 h-8 rounded-full transition-all relative '+(pActive?'bg-green-500':'bg-gray-600') },
                e('div', { className:'w-6 h-6 bg-white rounded-full absolute top-1 transition-all '+(pActive?'right-1':'left-1'), style:{transition:'all 0.2s'} })
              )
            ),

            e('div', null,
              e('label', { className:'block text-sm font-bold mb-2' }, 'תאריך / זמן האירוע'),
              e('input', { type:'text', placeholder:'למשל: יום חמישי 23.5 בשעה 22:00', value:pDate, onChange:ev=>setPDate(ev.target.value),
                className:'w-full px-4 py-3 bg-black/50 border border-white/10 rounded-xl text-white text-right focus:outline-none focus:border-red-500' })
            ),

            e('div', null,
              e('label', { className:'block text-sm font-bold mb-2' }, 'טקסט ההכרזה'),
              e('textarea', { rows:4, placeholder:"למשל: 🔥 מסיבת קהילה הלילה! הצטרפו אלינו בשעה 22:00 לערב בלתי נשכח...", value:pText, onChange:ev=>setPText(ev.target.value),
                className:'w-full px-4 py-3 bg-black/50 border border-white/10 rounded-xl text-white text-right focus:outline-none focus:border-red-500 resize-none' })
            ),

            // Preview
            (pText||pDate) && e('div', { className:'bg-gradient-to-r from-purple-900/60 to-pink-900/60 border border-purple-500/40 rounded-xl p-4' },
              e('div', { className:'text-purple-300 text-xs font-bold mb-2' }, '👁️ תצוגה מקדימה:'),
              e('div', { className:'font-black text-white text-lg' }, '🎉 מסיבת קהילה!'),
              pDate && e('div', { className:'text-yellow-300 font-bold' }, '📅 '+pDate),
              pText && e('div', { className:'text-white/90 text-sm mt-1' }, pText)
            ),

            e('button', { onClick:saveParty,
              className:'w-full py-4 bg-red-600 hover:bg-red-700 rounded-xl font-bold text-lg' }, '💾 שמור הכרזה')
          )
        ),

        // ── PINNED ──
        tab==='pinned' && e('div', null,
          e('h1', { className:'text-3xl font-bold mb-2' }, '📌 הודעה נעוצה'),
          e('p', { className:'text-gray-400 mb-6' }, "מופיעה בראש הצ'אט לכל המשתמשים"),

          pinned?.text && e('div', { className:'glass rounded-xl p-5 mb-6 border border-yellow-600/30 bg-yellow-900/10' },
            e('div', { className:'text-yellow-300 font-bold mb-2' }, '📌 נעוצה כרגע:'),
            e('div', { className:'text-white whitespace-pre-wrap mb-4' }, pinned.text),
            e('button', { onClick:doUnpin, className:'px-4 py-2 bg-red-600/20 hover:bg-red-600 rounded-lg text-sm' }, '🗑️ הסר')
          ),

          e('div', { className:'glass rounded-2xl p-6' },
            e('textarea', { rows:5, placeholder:"טקסט להודעה נעוצה... למשל: ברוכים הבאים! נא להתנהג בכבוד", value:pinTxt, onChange:ev=>setPinTxt(ev.target.value),
              className:'w-full px-4 py-3 bg-black/50 border border-white/10 rounded-xl text-white text-right focus:outline-none focus:border-red-500 resize-none mb-4' }),
            e('button', { onClick:doPin, disabled:!pinTxt.trim(),
              className:'px-6 py-3 bg-red-600 hover:bg-red-700 disabled:bg-gray-700 disabled:cursor-not-allowed rounded-xl font-bold' },
              pinned?.text ? '📌 עדכן הודעה נעוצה' : '📌 נעץ הודעה')
          )
        ),

        // ── BANS ──
        tab==='bans' && e('div', null,
          e('h1', { className:'text-3xl font-bold mb-6' }, '🚫 משתמשים חסומים'),
          bans.length===0
            ? e('div', { className:'text-gray-500 text-center py-16 text-lg' }, 'אין חסומים')
            : e('div', { className:'space-y-3' },
                bans.map(b => e('div', { key:b._id, className:'glass rounded-xl p-5 flex items-center justify-between' },
                  e('div', null,
                    e('div', { className:'font-bold text-lg' }, b.nickname),
                    b.reason && e('div', { className:'text-gray-400 text-sm mt-1' }, 'סיבה: '+b.reason)
                  ),
                  e('button', { onClick:()=>unban(b.nickname),
                    className:'px-4 py-2 bg-green-600/20 hover:bg-green-600 text-green-300 hover:text-white rounded-lg text-sm transition-all' }, '✓ בטל חסימה')
                ))
              )
        )
      ) // end main content
    );
  }

  function App() {
    const [ok, setOk] = useState(()=>{ try{return sessionStorage.getItem('admin_ok')==='1';}catch(e){return false;} });
    return ok ? React.createElement(Dashboard) : React.createElement(Login,{onSuccess:()=>setOk(true)});
  }

  ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App));
});
</script>
</body>
</html>
