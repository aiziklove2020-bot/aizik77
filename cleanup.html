<!DOCTYPE html>
<html>
<head><title>Cleanup</title></head>
<body>
<button onclick="cleanup()" style="padding:20px;font-size:18px;background:red;color:white;cursor:pointer">נקה משתמשים ישנים מ-Firebase</button>
<div id="log" style="margin-top:20px;font-family:monospace"></div>
<script type="module">
const { initializeApp } = await import('https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js');
const { getFirestore, collection, getDocs, deleteDoc, doc } = await import('https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js');

const app = initializeApp({
  apiKey: "AIzaSyAJv0APn-Qmv59H2Behu3PhskObCaPHW_A",
  authDomain: "tbdsm-5acca.firebaseapp.com",
  projectId: "tbdsm-5acca"
});
const db = getFirestore(app);

window.cleanup = async () => {
  const log = document.getElementById('log');
  log.innerHTML = 'מנקה...';
  const snap = await getDocs(collection(db, 'chatNicknames'));
  const cutoff = Date.now() - 45000;
  let deleted = 0;
  for (const d of snap.docs) {
    const data = d.data();
    const lastAt = data.lastSeenAt?.seconds ? data.lastSeenAt.seconds * 1000 : 0;
    if (Date.now() - lastAt > 45000) {
      await deleteDoc(doc(db, 'chatNicknames', d.id));
      deleted++;
      log.innerHTML += '<br>מחק: ' + data.nickname;
    }
  }
  log.innerHTML += '<br><b>נמחקו ' + deleted + ' משתמשים ישנים</b>';
};
</script>
</body>
</html>
