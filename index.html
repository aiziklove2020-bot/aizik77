<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>מסיבות ליברליות בישראל - כל העולמות במקום אחד</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Heebo', sans-serif; }
        .glass-effect {
            background: rgba(20, 20, 20, 0.8);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
    </style>
</head>
<body class="bg-[#050505] text-gray-100 min-h-screen">

    <nav class="p-6 flex justify-between items-center max-w-6xl mx-auto">
        <div class="text-xl md:text-2xl font-bold tracking-tighter text-white">
            מסיבות <span class="text-rose-500">ליברליות</span> בישראל
        </div>
        <div class="hidden md:flex gap-8 text-sm font-semibold uppercase tracking-widest text-gray-400">
            <a href="#" class="hover:text-rose-500 transition">בית</a>
            <a href="#" class="text-rose-500">פורטל אירועים</a>
            <a href="#" class="hover:text-rose-500 transition">קהילה</a>
        </div>
    </nav>

    <header class="max-w-4xl mx-auto text-center px-4 py-12">
        <h1 class="text-4xl md:text-5xl font-extrabold mb-6">הפורטל המלא לכל סצנת הלילה</h1>
        <p class="text-gray-400 text-lg mb-8">מטכנו ועד אירועים פרטיים, מאינטימיות ועד רייבים. כאן תמצא את הכל.</p>
    </header>

    <section class="max-w-6xl mx-auto px-4 py-8">
        <div id="filterBar" class="flex flex-wrap justify-center gap-3 mb-10">
            <button onclick="filterEvents('הכל')" class="px-5 py-2 rounded-full bg-rose-500 text-white font-bold transition">הכל</button>
            <button onclick="filterEvents('טכנו')" class="px-5 py-2 rounded-full bg-gray-900 hover:bg-gray-800 transition">טכנו ודאנס</button>
            <button onclick="filterEvents('פטיש')" class="px-5 py-2 rounded-full bg-gray-900 hover:bg-gray-800 transition">פטיש ו-Kink</button>
            <button onclick="filterEvents('סודיות')" class="px-5 py-2 rounded-full bg-gray-900 hover:bg-gray-800 transition">מסיבות סודיות</button>
            <button onclick="filterEvents('לייף סטייל')" class="px-5 py-2 rounded-full bg-gray-900 hover:bg-gray-800 transition">לייף סטייל</button>
        </div>

        <div id="eventsGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
            <!-- Events injected via JS -->
        </div>
    </section>

    <script>
        const events = [
            { id: 1, title: 'Midnight Masquerade', category: 'סודיות', theme: 'תחפושות ואלגנטיות', location: 'תל אביב', date: '28/06', dress: 'Formal / Mask', img: 'https://placehold.co/400x500/171717/ffffff?text=Masquerade' },
            { id: 2, title: 'Neon Freedom', category: 'טכנו', theme: 'טכנו ואנרגיה', location: 'חורשה סודית', date: '02/07', dress: 'Anything goes', img: 'https://placehold.co/400x500/4c0519/ffffff?text=Neon' },
            { id: 3, title: 'Velvet Lounge', category: 'לייף סטייל', theme: 'אווירה רגועה', location: 'מרכז הארץ', date: '05/07', dress: 'Casual/Sexy', img: 'https://placehold.co/400x500/581c87/ffffff?text=Velvet' },
            { id: 4, title: 'Fetish Night', category: 'פטיש', theme: 'עור וגומי', location: 'מועדון פרטי', date: '10/07', dress: 'Strict Dresscode', img: 'https://placehold.co/400x500/000000/ffffff?text=Fetish' },
            { id: 5, title: 'Techno Underground', category: 'טכנו', theme: 'ביטים כבדים', location: 'דרום', date: '12/07', dress: 'Black', img: 'https://placehold.co/400x500/1f2937/ffffff?text=Techno' },
            { id: 6, title: 'Secret Garden', category: 'סודיות', theme: 'טבע ומסתורין', location: 'צפון', date: '15/07', dress: 'Boho/Chic', img: 'https://placehold.co/400x500/064e3b/ffffff?text=Secret' }
        ];

        function filterEvents(category) {
            const grid = document.getElementById('eventsGrid');
            const filtered = category === 'הכל' ? events : events.filter(e => e.category === category);
            
            grid.innerHTML = filtered.map(event => `
                <div class="glass-effect rounded-3xl overflow-hidden hover:border-rose-500/50 transition duration-500 group">
                    <div class="relative h-64 overflow-hidden">
                        <img src="${event.img}" alt="${event.title}" class="w-full h-full object-cover group-hover:scale-110 transition duration-700">
                        <div class="absolute top-4 right-4 bg-black/50 backdrop-blur px-3 py-1 rounded-full text-xs font-bold text-rose-500">
                            ${event.date}
                        </div>
                    </div>
                    <div class="p-6">
                        <div class="text-[10px] uppercase tracking-widest text-rose-500 mb-2 font-bold">${event.category}</div>
                        <h3 class="text-2xl font-bold mb-2">${event.title}</h3>
                        <p class="text-gray-400 text-sm mb-4">${event.theme}</p>
                        
                        <div class="space-y-2 mb-6 text-sm text-gray-500">
                            <div class="flex items-center gap-2">
                                <i data-lucide="map-pin" class="w-4 h-4"></i> ${event.location}
                            </div>
                            <div class="flex items-center gap-2">
                                <i data-lucide="shirt" class="w-4 h-4"></i> דראס קוד: ${event.dress}
                            </div>
                        </div>

                        <button class="w-full py-3 bg-white text-black font-bold rounded-xl hover:bg-rose-500 hover:text-white transition">
                            פרטים נוספים
                        </button>
                    </div>
                </div>
            `).join('');
            lucide.createIcons();
        }

        window.onload = () => filterEvents('הכל');
    </script>
</body>
</html>
