<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BDSM Chat</title>

  <!-- Tailwind CSS (Play CDN - runs in browser, no build needed) -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Hebrew font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@200;300;400;600;700;800&family=Inter:wght@900&display=swap" rel="stylesheet">

  <!-- React + ReactDOM -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

  <!-- Alias for lucide-react UMD (it expects lowercase `react` global) -->
  <script>window.react = window.React;</script>

  <!-- Lucide icons (React version, UMD build) -->
  <script crossorigin src="https://unpkg.com/lucide-react@0.263.1/dist/umd/lucide-react.js"></script>

  <!-- Babel Standalone - lets the browser run JSX directly -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    * { font-family: 'Assistant', sans-serif; }
    body { margin: 0; background: #000; color: #fff; -webkit-font-smoothing: antialiased; }
    #root { min-height: 100vh; }
    .glass-panel { background: rgba(10,10,10,0.6); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.05); }
    .logo-glow { text-shadow: 0 0 30px rgba(204, 0, 0, 0.4); }
  </style>
</head>
<body>
  <div id="root">
    <div style="display:flex;align-items:center;justify-content:center;height:100vh;color:#888;font-size:18px;">
      טוען...
    </div>
  </div>

  <script type="text/babel" data-presets="react" data-type="module">
    // Pull React hooks from the global React object (loaded via CDN above)
    const { useState, useEffect, useRef } = React;

    // Pull icons from the global lucide-react UMD bundle
    const {
      Video, VideoOff, Mic, MicOff, Phone, PhoneOff, Send, Users,
      LogOut, Settings, Plus, X, Ban, Trash2, UserPlus, MessageSquare, Shield
    } = LucideReact;


const BDSMChat = () => {
  // Authentication & Users
  const [isLoggedIn, setIsLoggedIn] = useState(false);
  const [currentUser, setCurrentUser] = useState(null);
  const [users, setUsers] = useState([
    { id: 1, username: 'admin', password: '2109', role: 'admin', online: false, banned: false },
    { id: 2, username: 'demo', password: 'demo', role: 'user', online: false, banned: false }
  ]);
  
  // Chat State
  const [currentView, setCurrentView] = useState('chat'); // 'chat', 'admin', 'private'
  const [currentRoom, setCurrentRoom] = useState('כללי');
  const [rooms, setRooms] = useState([
    { id: 1, name: 'כללי', icon: '💬', description: 'שיחות כלליות' },
    { id: 2, name: 'מסיבות', icon: '🎉', description: 'ארגון מסיבות' },
    { id: 3, name: 'שיבארי', icon: '🪢', description: 'אומנות הקשירה' },
    { id: 4, name: 'סשנים', icon: '⛓️', description: 'סשנים וחוויות' },
    { id: 5, name: 'פמדום', icon: '👑', description: 'נשים שולטות' }
  ]);
  const [messages, setMessages] = useState([]);
  const [newMessage, setNewMessage] = useState('');
  const [isLoading, setIsLoading] = useState(false);
  
  // Private Messages
  const [privateChats, setPrivateChats] = useState({});
  const [activePrivateChat, setActivePrivateChat] = useState(null);
  const [privateMessage, setPrivateMessage] = useState('');
  
  // Video Call
  const [isVideoEnabled, setIsVideoEnabled] = useState(false);
  const [isAudioEnabled, setIsAudioEnabled] = useState(false);
  const [isInCall, setIsInCall] = useState(false);
  const [callWith, setCallWith] = useState(null);
  
  // Admin Panel
  const [showAdminPanel, setShowAdminPanel] = useState(false);
  const [newRoomName, setNewRoomName] = useState('');
  const [newRoomIcon, setNewRoomIcon] = useState('');
  const [newRoomDesc, setNewRoomDesc] = useState('');
  
  // Registration
  const [showRegister, setShowRegister] = useState(false);
  const [regUsername, setRegUsername] = useState('');
  const [regPassword, setRegPassword] = useState('');
  const [regConfirmPassword, setRegConfirmPassword] = useState('');
  const [isGuest, setIsGuest] = useState(false);
  
  // Mask Mode (Anonymous)
  const [maskMode, setMaskMode] = useState(false);
  const [selectedMask, setSelectedMask] = useState(null);
  const [showMaskSelector, setShowMaskSelector] = useState(false);
  const [availableMasks] = useState([
    { id: 1, emoji: '🦊', name: 'השועל האדום', color: 'from-red-600 to-orange-600' },
    { id: 2, emoji: '🐺', name: 'הזאב האפור', color: 'from-gray-600 to-gray-800' },
    { id: 3, emoji: '🦇', name: 'העטלף השחור', color: 'from-purple-600 to-black' },
    { id: 4, emoji: '🦋', name: 'הפרפר הכחול', color: 'from-blue-600 to-cyan-600' },
    { id: 5, emoji: '🌹', name: 'הוורד הקוצני', color: 'from-pink-600 to-red-600' },
    { id: 6, emoji: '🐉', name: 'הדרקון האדום', color: 'from-red-700 to-yellow-600' },
    { id: 7, emoji: '🦅', name: 'הנשר השחור', color: 'from-gray-800 to-yellow-700' },
    { id: 8, emoji: '🐍', name: 'הנחש הירוק', color: 'from-green-600 to-lime-600' },
    { id: 9, emoji: '🦁', name: 'האריה הזהוב', color: 'from-yellow-600 to-orange-600' },
    { id: 10, emoji: '🕷️', name: 'העכביש השחור', color: 'from-black to-red-900' }
  ]);
  
  // Show/Hide Users Sidebar
  const [showUsersSidebar, setShowUsersSidebar] = useState(false);
  
  // Party Announcements
  const [showPartyAnnouncement, setShowPartyAnnouncement] = useState(false);
  const [partyAnnouncementText, setPartyAnnouncementText] = useState('');
  
  // Admin Reports & Logs
  const [reports, setReports] = useState([]);
  const [adminLogs, setAdminLogs] = useState([]);
  const [pinnedMessages, setPinnedMessages] = useState([]);
  
  // Add admin log function
  const addAdminLog = (action) => {
    const log = {
      id: Date.now(),
      user: currentUser.username,
      action: action,
      timestamp: new Date().toLocaleString('he-IL')
    };
    setAdminLogs(prev => [log, ...prev].slice(0, 50)); // Keep last 50 logs
  };
  
  // Pin/Unpin message
  const togglePinMessage = (messageIndex) => {
    if (currentUser?.role === 'admin') {
      const msg = messages[messageIndex];
      if (pinnedMessages.find(p => p.text === msg.text && p.timestamp === msg.timestamp)) {
        setPinnedMessages(pinnedMessages.filter(p => !(p.text === msg.text && p.timestamp === msg.timestamp)));
        addAdminLog(`ביטל נעיצת הודעה: "${msg.text.substring(0, 30)}..."`);
      } else {
        setPinnedMessages([...pinnedMessages, msg]);
        addAdminLog(`נעץ הודעה: "${msg.text.substring(0, 30)}..."`);
      }
    }
  };
  
  // Delete message
  const deleteMessage = (messageIndex) => {
    if (currentUser?.role === 'admin') {
      const msg = messages[messageIndex];
      if (window.confirm('האם למחוק הודעה זו?')) {
        setMessages(messages.filter((_, idx) => idx !== messageIndex));
        addAdminLog(`מחק הודעה מ-${msg.user}: "${msg.text.substring(0, 30)}..."`);
      }
    }
  };
  
  // Check if it's party day (Thursday or Friday)
  useEffect(() => {
    const checkPartyDay = () => {
      const today = new Date().getDay(); // 0 = Sunday, 4 = Thursday, 5 = Friday
      
      if (today === 4) { // Thursday
        setShowPartyAnnouncement(true);
        setPartyAnnouncementText('🎉 מסיבת קהילה הערב! הצטרפו אלינו למסיבה הכי שווה של השבוע!');
      } else if (today === 5) { // Friday
        setShowPartyAnnouncement(true);
        setPartyAnnouncementText('🔥 ערב שישי של אש! מסיבה מיוחדת הערב - אל תפספסו!');
      } else {
        setShowPartyAnnouncement(false);
      }
    };
    
    checkPartyDay();
    // Check again every hour in case day changes
    const interval = setInterval(checkPartyDay, 3600000);
    return () => clearInterval(interval);
  }, []);
  
  const localVideoRef = useRef(null);
  const remoteVideoRef = useRef(null);
  const localStreamRef = useRef(null);
  const messagesEndRef = useRef(null);

  useEffect(() => {
    messagesEndRef.current?.scrollIntoView({ behavior: 'smooth' });
  }, [messages]);

  // Authentication Functions
  const handleLogin = (username, password) => {
    const user = users.find(u => u.username === username && u.password === password);
    if (user) {
      if (user.banned) {
        alert('המשתמש חסום ולא יכול להתחבר');
        return;
      }
      const updatedUsers = users.map(u => 
        u.id === user.id ? { ...u, online: true } : u
      );
      setUsers(updatedUsers);
      setCurrentUser(user);
      setIsLoggedIn(true);
      addSystemMessage(`${username} הצטרף לצ'אט`);
    } else {
      alert('שם משתמש או סיסמה שגויים');
    }
  };

  const handleRegister = () => {
    if (!regUsername || !regPassword) {
      alert('נא למלא את כל השדות');
      return;
    }
    if (regPassword !== regConfirmPassword) {
      alert('הסיסמאות אינן תואמות');
      return;
    }
    if (users.find(u => u.username === regUsername)) {
      alert('שם המשתמש כבר קיים');
      return;
    }
    
    const newUser = {
      id: users.length + 1,
      username: regUsername,
      password: regPassword,
      role: 'user',
      online: false,
      banned: false
    };
    setUsers([...users, newUser]);
    alert('נרשמת בהצלחה! כעת תוכל להתחבר');
    setShowRegister(false);
    setRegUsername('');
    setRegPassword('');
    setRegConfirmPassword('');
  };

  const handleGuestLogin = () => {
    const guestNumber = Math.floor(Math.random() * 10000);
    const guestUser = {
      id: Date.now(),
      username: `אורח_${guestNumber}`,
      role: 'guest',
      online: true,
      banned: false
    };
    setCurrentUser(guestUser);
    setIsLoggedIn(true);
    setIsGuest(true);
    addSystemMessage(`${guestUser.username} הצטרף כאורח`);
  };

  const toggleMaskMode = (mask) => {
    if (isGuest) {
      alert('🔒 מצב מסכה זמין רק למשתמשים רשומים!\n\nהירשם עכשיו כדי ליהנות מאנונימיות מלאה');
      return;
    }
    
    if (!maskMode) {
      setSelectedMask(mask);
      setMaskMode(true);
      setShowMaskSelector(false);
      addSystemMessage(`${mask.emoji} ${mask.name} הצטרף לצ'אט`);
    } else {
      setMaskMode(false);
      setSelectedMask(null);
      addSystemMessage(`${currentUser.username} חזר למצב רגיל`);
    }
  };

  const getDisplayName = () => {
    if (maskMode && selectedMask) {
      return `${selectedMask.emoji} ${selectedMask.name}`;
    }
    return currentUser.username;
  };

  const handleLogout = () => {
    const updatedUsers = users.map(u => 
      u.id === currentUser.id ? { ...u, online: false } : u
    );
    setUsers(updatedUsers);
    addSystemMessage(`${currentUser.username} התנתק`);
    setCurrentUser(null);
    setIsLoggedIn(false);
    setCurrentView('chat');
  };

  // Message Functions
  const addSystemMessage = (text) => {
    setMessages(prev => [...prev, {
      type: 'system',
      text,
      timestamp: new Date().toLocaleTimeString('he-IL')
    }]);
  };

  const sendMessage = async () => {
    if (newMessage.trim() && currentUser) {
      const userMsg = {
        type: 'user',
        user: getDisplayName(),
        userId: currentUser.id,
        realUser: currentUser.username,
        isMasked: maskMode,
        text: newMessage,
        room: currentRoom,
        timestamp: new Date().toLocaleTimeString('he-IL')
      };
      
      setMessages(prev => [...prev, userMsg]);
      const messageToSend = newMessage;
      setNewMessage('');
      setIsLoading(true);

      try {
        const response = await fetch('https://api.anthropic.com/v1/messages', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            model: 'claude-sonnet-4-20250514',
            max_tokens: 1000,
            messages: [{
              role: 'user',
              content: `אתה משתתף בצ'אט קהילתי BDSM בעברית. החדר: "${currentRoom}". 
              תגובה קצרה (1-3 משפטים), ידידותית, רלוונטית לנושא.
              ההודעה: "${messageToSend}"
              ענה כמשתתף רגיל בצ'אט.`
            }]
          })
        });

        const data = await response.json();
        const aiText = data.content.find(item => item.type === 'text')?.text || 'אופס!';

        setMessages(prev => [...prev, {
          type: 'ai',
          user: 'קלוד',
          text: aiText,
          room: currentRoom,
          timestamp: new Date().toLocaleTimeString('he-IL')
        }]);
      } catch (error) {
        console.error('Error:', error);
      } finally {
        setIsLoading(false);
      }
    }
  };

  // Private Message Functions
  const sendPrivateMessage = () => {
    if (privateMessage.trim() && activePrivateChat) {
      const newMsg = {
        from: currentUser.username,
        to: activePrivateChat,
        text: privateMessage,
        timestamp: new Date().toLocaleTimeString('he-IL')
      };
      
      const chatKey = [currentUser.username, activePrivateChat].sort().join('-');
      setPrivateChats(prev => ({
        ...prev,
        [chatKey]: [...(prev[chatKey] || []), newMsg]
      }));
      setPrivateMessage('');
    }
  };

  const startPrivateChat = (username) => {
    if (isGuest) {
      alert('🔒 תכונה זו זמינה רק למשתמשים רשומים!\n\nהירשם עכשיו כדי:\n✓ לשלוח הודעות פרטיות\n✓ לבצע שיחות וידאו\n✓ לשמור היסטוריה\n✓ ליהנות מכל התכונות');
      return;
    }
    setActivePrivateChat(username);
    setCurrentView('private');
  };

  // Video Call Functions
  const startVideoCall = async (withUser) => {
    if (isGuest) {
      alert('🔒 תכונה זו זמינה רק למשתמשים רשומים!\n\nהירשם עכשיו כדי:\n✓ לבצע שיחות וידאו\n✓ לשלוח הודעות פרטיות\n✓ לשמור היסטוריה\n✓ ליהנות מכל התכונות');
      return;
    }
    try {
      const stream = await navigator.mediaDevices.getUserMedia({
        video: isVideoEnabled,
        audio: isAudioEnabled
      });
      localStreamRef.current = stream;
      if (localVideoRef.current) {
        localVideoRef.current.srcObject = stream;
      }
      setIsInCall(true);
      setCallWith(withUser);
      addSystemMessage(`שיחת וידאו עם ${withUser} התחילה`);
    } catch (error) {
      alert('לא ניתן לגשת למצלמה/מיקרופון');
    }
  };

  const endVideoCall = () => {
    if (localStreamRef.current) {
      localStreamRef.current.getTracks().forEach(track => track.stop());
      localStreamRef.current = null;
    }
    if (localVideoRef.current) {
      localVideoRef.current.srcObject = null;
    }
    addSystemMessage(`שיחת וידאו עם ${callWith} הסתיימה`);
    setIsInCall(false);
    setCallWith(null);
  };

  // Admin Functions
  const addRoom = () => {
    if (newRoomName.trim() && currentUser?.role === 'admin') {
      const newRoom = {
        id: rooms.length + 1,
        name: newRoomName,
        icon: newRoomIcon || '💭',
        description: newRoomDesc || ''
      };
      setRooms([...rooms, newRoom]);
      addSystemMessage(`חדר חדש נוסף: ${newRoomName}`);
      addAdminLog(`הוסיף חדר: ${newRoomName}`);
      setNewRoomName('');
      setNewRoomIcon('');
      setNewRoomDesc('');
    }
  };

  const deleteRoom = (roomId) => {
    if (currentUser?.role === 'admin') {
      const room = rooms.find(r => r.id === roomId);
      if (window.confirm(`האם למחוק את החדר "${room.name}"?`)) {
        setRooms(rooms.filter(r => r.id !== roomId));
        addSystemMessage(`החדר "${room.name}" נמחק`);
        addAdminLog(`מחק חדר: ${room.name}`);
        if (currentRoom === room.name) {
          setCurrentRoom('כללי');
        }
      }
    }
  };

  const banUser = (userId) => {
    if (currentUser?.role === 'admin') {
      const user = users.find(u => u.id === userId);
      if (user.role === 'admin') {
        alert('לא ניתן לחסום מנהל');
        return;
      }
      const updatedUsers = users.map(u =>
        u.id === userId ? { ...u, banned: !u.banned, online: u.banned ? u.online : false } : u
      );
      setUsers(updatedUsers);
      addSystemMessage(`${user.username} ${user.banned ? 'בוטל חסימתו' : 'נחסם'}`);
      addAdminLog(`${user.banned ? 'ביטל חסימה' : 'חסם'} משתמש: ${user.username}`);
    }
  };

  const kickUser = (userId) => {
    if (currentUser?.role === 'admin') {
      const user = users.find(u => u.id === userId);
      if (user.role === 'admin') {
        alert('לא ניתן לבעוט מנהל');
        return;
      }
      const updatedUsers = users.map(u =>
        u.id === userId ? { ...u, online: false } : u
      );
      setUsers(updatedUsers);
      addSystemMessage(`${user.username} נבעט מהצ'אט`);
      addAdminLog(`בעט משתמש: ${user.username}`);
    }
  };

  // Login/Register Screen
  if (!isLoggedIn) {
    return (
      <div className="min-h-screen bg-black flex items-center justify-center p-4 relative overflow-hidden">
        <div className="absolute inset-0 stars-bg"></div>
        
        <style>{`
          @import url('https://fonts.googleapis.com/css2?family=Assistant:wght@200;300;400;600;700;800&family=Inter:wght@900&display=swap');
          
          * {
            font-family: 'Assistant', sans-serif;
          }
          
          .stars-bg {
            background: 
              radial-gradient(2px 2px at 10% 20%, white, transparent),
              radial-gradient(2px 2px at 25% 40%, white, transparent),
              radial-gradient(1px 1px at 40% 10%, white, transparent),
              radial-gradient(3px 3px at 60% 30%, white, transparent),
              radial-gradient(2px 2px at 75% 60%, white, transparent),
              radial-gradient(1px 1px at 85% 15%, white, transparent),
              radial-gradient(2px 2px at 15% 70%, white, transparent),
              radial-gradient(1px 1px at 45% 80%, white, transparent),
              radial-gradient(3px 3px at 90% 50%, white, transparent),
              radial-gradient(2px 2px at 30% 55%, white, transparent);
            background-size: 100% 100%;
            animation: twinkle 3s ease-in-out infinite alternate;
          }
          
          @keyframes twinkle {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
          }
          
          .glass-panel {
            background: rgba(10, 10, 10, 0.6);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.05);
          }
          
          .logo-glow {
            text-shadow: 0 0 30px rgba(204, 0, 0, 0.4);
          }
          
          .hero-gradient {
            background: radial-gradient(circle at center, rgba(204, 0, 0, 0.12) 0%, rgba(0, 0, 0, 0) 70%);
          }
        `}</style>
        
        <div className="relative z-10 glass-panel p-10 rounded-3xl shadow-2xl max-w-lg w-full">
          <div className="flex flex-col items-center mb-8">
            <div className="text-center mb-6">
              <div className="mb-2">
                <span className="text-6xl font-black logo-glow" style={{ 
                  color: '#CC0000', 
                  letterSpacing: '-0.05em',
                  fontStyle: 'italic'
                }}>
                  מדברים
                </span>
              </div>
              <div className="mb-4">
                <span className="text-6xl font-black text-white" style={{ 
                  letterSpacing: '-0.05em',
                  fontStyle: 'italic'
                }}>
                  בדסמ
                </span>
              </div>
              <div className="english-sub text-white text-sm tracking-widest font-black" style={{ 
                fontFamily: 'Inter, sans-serif',
                letterSpacing: '0.6em'
              }}>
                TALKING BDSM
              </div>
              <div className="text-red-600 text-xs tracking-wider mt-2 uppercase" style={{ letterSpacing: '0.3em' }}>
                SAFE · SANE · CONSENSUAL
              </div>
            </div>
          </div>
          
          {!showRegister ? (
            // Login Form
            <div className="space-y-4">
              <div>
                <label className="block text-sm font-medium text-gray-300 mb-2 text-right">שם משתמש</label>
                <input
                  type="text"
                  id="loginUsername"
                  placeholder="הזן שם משתמש"
                  className="w-full px-5 py-4 bg-black/50 border border-red-600/30 rounded-xl text-white text-lg placeholder-gray-500 focus:outline-none focus:border-red-500 focus:ring-2 focus:ring-red-500/20 text-right"
                  onKeyPress={(e) => {
                    if (e.key === 'Enter') {
                      const password = document.getElementById('loginPassword').value;
                      handleLogin(e.target.value, password);
                    }
                  }}
                />
              </div>
              <div>
                <label className="block text-sm font-medium text-gray-300 mb-2 text-right">סיסמה</label>
                <input
                  type="password"
                  id="loginPassword"
                  placeholder="הזן סיסמה"
                  className="w-full px-5 py-4 bg-black/50 border border-red-600/30 rounded-xl text-white text-lg placeholder-gray-500 focus:outline-none focus:border-red-500 focus:ring-2 focus:ring-red-500/20 text-right"
                  onKeyPress={(e) => {
                    if (e.key === 'Enter') {
                      const username = document.getElementById('loginUsername').value;
                      handleLogin(username, e.target.value);
                    }
                  }}
                />
              </div>
              <button
                onClick={() => {
                  const username = document.getElementById('loginUsername').value;
                  const password = document.getElementById('loginPassword').value;

              {/* Statistics Dashboard */}
              <div className="grid grid-cols-1 md:grid-cols-4 gap-4 mb-8">
                <div className="glass-panel p-6 rounded-2xl border border-blue-600/30">
                  <div className="flex items-center gap-3 mb-2">
                    <div className="text-3xl">👥</div>
                    <div className="text-sm text-gray-400">סה"כ משתמשים</div>
                  </div>
                  <div className="text-3xl font-bold text-white">{users.length}</div>
                </div>
                
                <div className="glass-panel p-6 rounded-2xl border border-green-600/30">
                  <div className="flex items-center gap-3 mb-2">
                    <div className="text-3xl">🟢</div>
                    <div className="text-sm text-gray-400">מחוברים עכשיו</div>
                  </div>
                  <div className="text-3xl font-bold text-green-400">{users.filter(u => u.online).length}</div>
                </div>
                
                <div className="glass-panel p-6 rounded-2xl border border-purple-600/30">
                  <div className="flex items-center gap-3 mb-2">
                    <div className="text-3xl">💬</div>
                    <div className="text-sm text-gray-400">הודעות היום</div>
                  </div>
                  <div className="text-3xl font-bold text-purple-400">{messages.length}</div>
                </div>
                
                <div className="glass-panel p-6 rounded-2xl border border-red-600/30">
                  <div className="flex items-center gap-3 mb-2">
                    <div className="text-3xl">🏠</div>
                    <div className="text-sm text-gray-400">חדרים פעילים</div>
                  </div>
                  <div className="text-3xl font-bold text-red-400">{rooms.length}</div>
                </div>
              </div>
              
              {/* Add Room */}
              <div className="bg-black/50 backdrop-blur-md border border-red-600/30 rounded-2xl p-6 mb-6">
                <h3 className="text-xl font-bold text-white mb-4">התראת מסיבה</h3>
                <div className="space-y-3">
                  <div className="p-4 bg-purple-900/20 border border-purple-500/30 rounded-xl">
                    <div className="flex items-center gap-2 mb-2">
                      <span className="text-2xl">🎉</span>
                      <span className="font-bold text-purple-300">התראות אוטומטיות</span>
                    </div>
                    <div className="text-sm text-gray-300 space-y-1">
                      <div>🗓️ <strong>חמישי:</strong> התראת מסיבה אוטומטית</div>
                      <div>🗓️ <strong>שישי:</strong> התראת מסיבה אוטומטית</div>
                    </div>
                  </div>
                  
                  <textarea
                    placeholder="הודעת מסיבה מותאמת אישית (אופציונלי)"
                    value={partyAnnouncementText}
                    onChange={(e) => setPartyAnnouncementText(e.target.value)}
                    className="w-full px-4 py-3 bg-black/50 border border-red-600/30 rounded-xl text-white placeholder-gray-500 focus:outline-none focus:border-red-500 min-h-[100px]"
                  />
                  
                  <button 
                    onClick={() => setShowPartyAnnouncement(!showPartyAnnouncement)}
                    className={`w-full px-4 py-3 rounded-xl font-semibold flex items-center justify-center gap-2 ${
                      showPartyAnnouncement 
                        ? 'bg-red-600 hover:bg-red-700' 
                        : 'bg-green-600 hover:bg-green-700'
                    }`}
                  >
                    {showPartyAnnouncement ? '🔕 כבה התראת מסיבה' : '🔔 הפעל התראת מסיבה'}
                  </button>
                </div>
              </div>

              {/* Add Room */}
              <div className="bg-black/50 backdrop-blur-md border border-red-600/30 rounded-2xl p-6 mb-6">
                <h3 className="text-xl font-bold text-white mb-4">הוסף חדר חדש</h3>
                <div className="space-y-3">
                  <input
                    type="text"
                    placeholder="שם החדר"
                    value={newRoomName}
                    onChange={(e) => setNewRoomName(e.target.value)}
                    className="w-full px-4 py-3 bg-black/50 border border-red-600/30 rounded-xl text-white placeholder-gray-500 focus:outline-none focus:border-red-500"
                  />
                  <input
                    type="text"
                    placeholder="אייקון (אימוג'י)"
                    value={newRoomIcon}
                    onChange={(e) => setNewRoomIcon(e.target.value)}
                    className="w-full px-4 py-3 bg-black/50 border border-red-600/30 rounded-xl text-white placeholder-gray-500 focus:outline-none focus:border-red-500"
                  />
                  <input
                    type="text"
                    placeholder="תיאור"
                    value={newRoomDesc}
                    onChange={(e) => setNewRoomDesc(e.target.value)}
                    className="w-full px-4 py-3 bg-black/50 border border-red-600/30 rounded-xl text-white placeholder-gray-500 focus:outline-none focus:border-red-500"
                  />
                  <button onClick={addRoom} className="w-full px-4 py-3 bg-red-600 hover:bg-red-700 rounded-xl font-semibold flex items-center justify-center gap-2">
                    <Plus className="w-5 h-5" />
                    הוסף חדר
                  </button>
                </div>
              </div>

              {/* Manage Rooms */}
              <div className="bg-black/50 backdrop-blur-md border border-red-600/30 rounded-2xl p-6 mb-6">
                <h3 className="text-xl font-bold text-white mb-4">ניהול חדרים</h3>
                <div className="space-y-2">
                  {rooms.map(room => (
                    <div key={room.id} className="flex items-center justify-between p-3 bg-black/50 rounded-xl border border-red-600/20">
                      <div className="flex items-center gap-3">
                        <span className="text-2xl">{room.icon}</span>
                        <div>
                          <div className="font-semibold text-white">{room.name}</div>
                          <div className="text-sm text-gray-400">{room.description}</div>
                        </div>
                      </div>
                      <button onClick={() => deleteRoom(room.id)} className="p-2 bg-red-600/20 hover:bg-red-600 rounded-lg transition-all">
                        <Trash2 className="w-4 h-4" />
                      </button>
                    </div>
                  ))}
                </div>
              </div>

              {/* Manage Users */}
              <div className="bg-black/50 backdrop-blur-md border border-red-600/30 rounded-2xl p-6">
                <h3 className="text-xl font-bold text-white mb-4">ניהול משתמשים</h3>
                <div className="space-y-2">
                  {users.filter(u => u.id !== currentUser.id).map(user => (
                    <div key={user.id} className="flex items-center justify-between p-3 bg-black/50 rounded-xl border border-red-600/20">
                      <div className="flex items-center gap-3">
                        <div className="w-10 h-10 bg-gradient-to-br from-red-600 to-red-800 rounded-full flex items-center justify-center">👤</div>
                        <div>
                          <div className="font-semibold text-white">
                            {user.username}
                            {user.maskMode && user.selectedMask && (
                              <span className="text-xs text-purple-400 mr-2">
                                (במסכה: {user.selectedMask.emoji} {user.selectedMask.name})
                              </span>
                            )}
                          </div>
                          <div className="text-sm text-gray-400">
                            {user.online && <span className="text-green-400">● מחובר</span>}
                            {user.banned && <span className="text-red-400">● חסום</span>}
                            {user.role === 'admin' && <span className="text-yellow-400"> (מנהל)</span>}
                          </div>
                        </div>
                      </div>
                      <div className="flex gap-2">
                        {user.online && (
                          <button onClick={() => kickUser(user.id)} className="p-2 bg-orange-600/20 hover:bg-orange-600 rounded-lg transition-all" title="בעט">
                            <X className="w-4 h-4" />
                          </button>
                        )}
                        <button onClick={() => banUser(user.id)} className={`p-2 rounded-lg transition-all ${user.banned ? 'bg-green-600/20 hover:bg-green-600' : 'bg-red-600/20 hover:bg-red-600'}`} title={user.banned ? 'בטל חסימה' : 'חסום'}>
                          <Ban className="w-4 h-4" />
                        </button>
                      </div>
                    </div>
                  ))}
                </div>
                <div className="mt-4 p-3 bg-purple-900/20 border border-purple-500/30 rounded-lg">
                  <div className="text-xs text-purple-300">
                    💡 <strong>הערה:</strong> כמנהל, אתה יכול לראות את הזהות האמיתית מאחורי מסכות. משתמשים רגילים רואים רק את המסכה.
                  </div>
                </div>
              </div>

              {/* Admin Activity Logs */}
              <div className="bg-black/50 backdrop-blur-md border border-red-600/30 rounded-2xl p-6">
                <h3 className="text-xl font-bold text-white mb-4">לוג פעילות מנהלים</h3>
                <div className="space-y-2 max-h-96 overflow-y-auto">
                  {adminLogs.length === 0 ? (
                    <div className="text-center text-gray-500 py-8">
                      <div className="text-4xl mb-2">📋</div>
                      <p className="text-sm">אין פעולות מנהלים עדיין</p>
                    </div>
                  ) : (
                    adminLogs.map(log => (
                      <div key={log.id} className="p-3 bg-black/50 rounded-xl border border-red-600/20 flex items-center justify-between">
                        <div className="flex items-center gap-3">
                          <div className="w-2 h-2 bg-red-400 rounded-full"></div>
                          <div>
                            <div className="text-sm text-white">
                              <span className="font-semibold text-red-400">{log.user}</span>
                              {' '}{log.action}
                            </div>
                            <div className="text-xs text-gray-500">{log.timestamp}</div>
                          </div>
                        </div>
                      </div>
                    ))
                  )}
                </div>
              </div>
            </div>
          )}

          {currentView === 'private' && (
            <div className="flex-1 flex flex-col">
              <div className="bg-black/70 backdrop-blur-md border-b border-red-600/30 px-8 py-5 flex items-center justify-between">
                <div>
                  <h1 className="text-2xl font-bold text-white">צ'אט פרטי עם {activePrivateChat}</h1>
                </div>
                <button onClick={() => setCurrentView('chat')} className="px-4 py-2 bg-black/50 rounded-lg hover:bg-black/70">
                  <X className="w-5 h-5" />
                </button>
              </div>

              <div className="flex-1 overflow-y-auto p-4 space-y-3">
                {(() => {
                  const chatKey = [currentUser.username, activePrivateChat].sort().join('-');
                  const msgs = privateChats[chatKey] || [];
                  return msgs.map((msg, idx) => (
                    <div key={idx} className={`flex ${msg.from === currentUser.username ? 'justify-start' : 'justify-end'}`}>
                      <div className={`px-5 py-3 rounded-2xl max-w-xl ${msg.from === currentUser.username ? 'bg-red-600' : 'bg-black/60 border border-red-600/20'}`}>
                        <div className="text-white">{msg.text}</div>
                        <div className="text-xs text-gray-300 mt-2">{msg.timestamp}</div>
                      </div>
                    </div>
                  ));
                })()}
              </div>

              <div className="bg-black/70 backdrop-blur-md border-t border-red-600/30 px-8 py-5">
                <div className="flex gap-3">
                  <button onClick={sendPrivateMessage} className="px-6 py-4 bg-red-600 hover:bg-red-700 rounded-xl">
                    <Send className="w-5 h-5" />
                  </button>
                  <input
                    type="text"
                    placeholder="הודעה פרטית..."
                    value={privateMessage}
                    onChange={(e) => setPrivateMessage(e.target.value)}
                    onKeyPress={(e) => e.key === 'Enter' && sendPrivateMessage()}
                    className="flex-1 px-5 py-4 bg-black/50 border border-red-600/30 rounded-xl text-white text-lg placeholder-gray-500 focus:outline-none focus:border-red-500"
                  />
                </div>
              </div>
            </div>
          )}
        </div>

        {/* Right Sidebar - Users (Slide-in Panel) */}
        <div className={`fixed top-0 left-0 h-screen w-80 glass-panel border-r border-white/5 z-50 transform transition-transform duration-300 ease-in-out ${
          showUsersSidebar ? 'translate-x-0' : '-translate-x-full'
        }`}>
          <div className="p-6 h-full flex flex-col overflow-y-auto">
            {/* Header */}
            <div className="mb-4 pb-4 border-b border-white/5">
              <div className="flex items-center justify-between mb-2">
                <h3 className="text-xl font-bold text-white">משתמשים מחוברים</h3>
                <button
                  onClick={() => setShowUsersSidebar(false)}
                  className="p-2 glass-panel hover:bg-white/5 rounded-lg transition-all"
                >
                  <X className="w-5 h-5" />
                </button>
              </div>
              <p className="text-sm text-gray-400">{onlineUsers.length} אונליין כרגע</p>
            </div>
            
          <div className="space-y-3 flex-1 overflow-y-auto">
            {onlineUsers.map(user => (
              <div key={user.id} className="px-4 py-3 bg-black/50 border border-red-600/20 rounded-xl flex items-center gap-3">
                <div className="w-11 h-11 bg-gradient-to-br from-red-600 to-red-800 rounded-full flex items-center justify-center shadow-lg">
                  {user.role === 'guest' ? '👻' : '👤'}
                </div>
                <div className="flex-1">
                  <div className="font-semibold text-white">
                    {user.username}
                    {user.role === 'guest' && <span className="text-xs text-yellow-400 mr-2">(אורח)</span>}
                  </div>
                  <div className="flex items-center gap-2 text-xs">
                    <div className="w-2 h-2 bg-green-400 rounded-full animate-pulse"></div>
                    <span className="text-green-400">מחובר</span>
                  </div>
                </div>
                <div className="flex gap-1">
                  <button 
                    onClick={() => startPrivateChat(user.username)} 
                    className={`p-2 rounded-lg transition-all ${isGuest ? 'bg-gray-600/20 cursor-not-allowed opacity-50' : 'bg-blue-600/20 hover:bg-blue-600'}`}
                    title={isGuest ? 'זמין רק למשתמשים רשומים' : 'הודעה פרטית'}
                    disabled={isGuest}
                  >
                    <MessageSquare className="w-4 h-4" />
                    {isGuest && <span className="text-xs">🔒</span>}
                  </button>
                  <button 
                    onClick={() => startVideoCall(user.username)} 
                    className={`p-2 rounded-lg transition-all ${isGuest ? 'bg-gray-600/20 cursor-not-allowed opacity-50' : 'bg-green-600/20 hover:bg-green-600'}`}
                    title={isGuest ? 'זמין רק למשתמשים רשומים' : 'שיחת וידאו'}
                    disabled={isGuest}
                  >
                    <Video className="w-4 h-4" />
                    {isGuest && <span className="text-xs">🔒</span>}
                  </button>
                </div>
              </div>
            ))}
            
            {onlineUsers.length === 0 && (
              <div className="text-center text-gray-500 py-12">
                <div className="text-5xl mb-2">👥</div>
                <p className="text-sm">אין משתמשים מחוברים</p>
              </div>
            )}
          </div>
          </div>
        </div>
      </div>
    </div>
  );
};


    // Mount the component
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<BDSMChat />);
  </script>
</body>
</html>
