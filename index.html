  <style>
    * { font-family: 'Assistant', sans-serif; }
    body { margin: 0; background: #000; color: #fff; -webkit-font-smoothing: antialiased; overscroll-behavior: none; }
    #root { min-height: 100vh; min-height: 100dvh; }
    /* Make h-screen work correctly on mobile (accounts for address bar) */
    .h-screen { height: 100vh; height: 100dvh; }
    .glass-panel { background: rgba(10,10,10,0.6); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.05); }
    .logo-glow { text-shadow: 0 0 30px rgba(204, 0, 0, 0.4); }
    /* Safe area support for iPhone notches */

    /* Prevent iOS zoom on input focus */
    @media (max-width: 767px) {
      input, textarea { font-size: 16px !important; }
    }
    .loader { display: flex; align-items: center; justify-content: center; height: 100vh; color: #888; font-size: 18px; flex-direction: column; gap: 16px; }
    .spinner { width: 40px; height: 40px; border: 3px solid #333; border-top-color: #cc0000; border-radius: 50%; animation: spin 1s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .error-box { background: #1a0000; border: 1px solid #cc0000; padding: 24px; border-radius: 8px; max-width: 600px; margin: 40px auto; color: #fff; }
    .error-box h2 { color: #ff4444; margin-top: 0; }
    .error-box code { background: #000; padding: 2px 6px; border-radius: 3px; color: #ffaa00; display: block; white-space: pre-wrap; margin: 12px 0; font-size: 12px; }

    /* Debug panel — shown when ?debug appears in the URL */
    #debug-panel {
      position: fixed; bottom: 0; left: 0; right: 0;
      background: rgba(0,0,0,0.92); border-top: 2px solid #cc0000;
      color: #fff; font-family: 'Courier New', monospace; font-size: 12px;
      padding: 12px; max-height: 220px; overflow-y: auto;
      z-index: 99999; display: none; direction: ltr; text-align: left;
    }
    #debug-panel.visible { display: block; }
    #debug-panel .line { padding: 2px 0; border-bottom: 1px solid #222; }
    #debug-panel .ok  { color: #4ade80; }
    #debug-panel .err { color: #ff6666; }
    #debug-panel .info { color: #60a5fa; }
    #debug-panel .title { font-weight: bold; color: #ffaa00; margin-bottom: 6px; }
    #debug-toggle {
      position: fixed; bottom: 10px; right: 10px;
      background: #cc0000; color: white; border: none; padding: 8px 14px;
      border-radius: 6px; cursor: pointer; z-index: 100000;

  <!-- Debug panel (hidden by default, shown with ?debug in URL) -->
  <button id="debug-toggle" onclick="document.getElementById('debug-panel').classList.toggle('visible')">🐛 Debug</button>
  <div id="debug-panel"><div class="title">🐛 DEBUG LOG</div></div>

  <script>
    // Debug logger — only active when ?debug is in URL
    (function() {
      const urlParams = new URLSearchParams(window.location.search);
      const debugMode = urlParams.has('debug');
      if (debugMode) {
        document.getElementById('debug-toggle').classList.add('visible');
        document.getElementById('debug-panel').classList.add('visible');
      }
      window.__debugLog = function(msg, type) {
        type = type || 'info';
        const panel = document.getElementById('debug-panel');
        if (!panel) return;
        const line = document.createElement('div');
        line.className = 'line ' + type;
        const time = new Date().toLocaleTimeString('en-GB');
        line.textContent = '[' + time + '] ' + msg;
        panel.appendChild(line);
        panel.scrollTop = panel.scrollHeight;
        // Also log to console
        console.log('[DEBUG]', msg);
      };
      // Catch all unhandled errors
      window.addEventListener('error', function(e) {
        window.__debugLog('💥 שגיאה לא-מטופלת: ' + (e.message || e.error), 'err');
      });
      window.addEventListener('unhandledrejection', function(e) {
        const msg = e.reason && e.reason.message ? e.reason.message : String(e.reason);
        window.__debugLog('💥 Promise rejected: ' + msg, 'err');
      });
    })();
  </script>

  <script type="module">
    const log = (m, t) => window.__debugLog && window.__debugLog(m, t);

    try {
      log('⏳ טוען את Firebase SDK...', 'info');
      const { initializeApp } =
        await import('https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js');
      const {
        getFirestore, collection, addDoc, query, where, orderBy,
        onSnapshot, serverTimestamp, deleteDoc, doc, limit,
        setDoc, getDoc, getDocs
      } = await import('https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js');
      log('✅ Firebase SDK נטען', 'ok');

      const firebaseConfig = {
        apiKey: "AIzaSyAJv0APn-Qmv59H2Behu3PhskObCaPHW_A",
        authDomain: "tbdsm-5acca.firebaseapp.com",
        projectId: "tbdsm-5acca",
        storageBucket: "tbdsm-5acca.firebasestorage.app",
        messagingSenderId: "905865425928",
        appId: "1:905865425928:web:1898ebb5b8de87ecf3cdbd",
        measurementId: "G-FRE3N3T6JH"
      };

      const app = initializeApp(firebaseConfig);
      const db  = getFirestore(app);
      log('✅ Firebase אותחל (project: tbdsm-5acca)', 'ok');
      log('ℹ️ משתמש ב-chatMessages collection (לא מתנגש באתר קיים)', 'info');

      // Expose helpers
      window.fbSendMessage = async (msg) => {
        const payload = Object.assign({}, msg, { createdAt: serverTimestamp() });
        log('📤 fbSendMessage → collection(chatMessages).add()', 'info');
        return await addDoc(collection(db, 'chatMessages'), payload);
      };

      window.fbDeleteMessage = async (firestoreId) => {
        return await deleteDoc(doc(db, 'chatMessages', firestoreId));
      };

      // Normalize nickname for use as document ID (Firestore forbids '/')
      const nickKey = (nick) => String(nick).trim().toLowerCase().replace(/[\/\\\s\.\#\$\[\]]/g, '_');

      // Claim a nickname. Returns {ok:true, userId} on success, {ok:false, reason:'taken'|'banned'} on failure.
      window.fbClaimNickname = async (nickname) => {
        const key = nickKey(nickname);
        if (!key) return { ok: false, reason: 'invalid' };

        // Reserved admin nicknames — only accessible via /admin panel
        const RESERVED_ADMIN_NICKS = ['aizik_love', 'miss_chen', 'aizik love', 'miss chen'];
        const normalizedNick = nickname.trim().toLowerCase();
        if (RESERVED_ADMIN_NICKS.includes(normalizedNick) || RESERVED_ADMIN_NICKS.includes(key)) {
          return { ok: false, reason: 'reserved' };
        }

        try {
          // Check ban list first
          const banRef = doc(db, 'chatBans', key);
          const banSnap = await getDoc(banRef);
          if (banSnap.exists()) return { ok: false, reason: 'banned' };

          // Check if nickname is already claimed
          const nickRef = doc(db, 'chatNicknames', key);
          const nickSnap = await getDoc(nickRef);
          if (nickSnap.exists()) {
            const data = nickSnap.data();
            // If last seen within 60 seconds, it's still "online" → taken.
            // Otherwise allow reclaim (covers users closing tab without logout).
            const lastAt = data.lastSeenAt && data.lastSeenAt.seconds ? data.lastSeenAt.seconds * 1000 : 0;
            if (Date.now() - lastAt < 60 * 1000) {
              return { ok: false, reason: 'taken' };
            }
          }

          const userId = 'u_' + Date.now() + '_' + Math.floor(Math.random() * 10000);
          await setDoc(nickRef, {
            nickname: nickname.trim(),
            userId: userId,
            claimedAt: serverTimestamp(),
            lastSeenAt: serverTimestamp()
          });
          log('✅ כינוי "' + nickname + '" נתפס (userId=' + userId + ')', 'ok');
          return { ok: true, userId: userId };
        } catch (err) {
          log('❌ fbClaimNickname error: ' + err.message, 'err');
          return { ok: false, reason: err.message };
        }
      };

      // Admin-only: claim a reserved admin nickname (bypasses the reserved check)
      window.fbClaimAdminNickname = async (nickname) => {
        const key = nickKey(nickname);
        if (!key) return { ok: false, reason: 'invalid' };
        try {
          const userId = 'admin_' + Date.now() + '_' + Math.floor(Math.random() * 10000);
          await setDoc(doc(db, 'chatNicknames', key), {
            nickname: nickname.trim(),
            userId: userId,
            isAdmin: true,
            claimedAt: serverTimestamp(),
            lastSeenAt: serverTimestamp()
          });
          return { ok: true, userId: userId };
        } catch (err) {
          return { ok: false, reason: err.message };
        }
      };

      // Release a nickname (called on logout)
      window.fbReleaseNickname = async (nickname, userId) => {
        const key = nickKey(nickname);
        if (!key) return;
        try {
          // Only release if we own it (matching userId)
          const nickRef = doc(db, 'chatNicknames', key);
          const snap = await getDoc(nickRef);
          if (snap.exists() && snap.data().userId === userId) {
            await deleteDoc(nickRef);
            log('🚪 כינוי "' + nickname + '" שוחרר', 'info');
          }
        } catch (err) {
          // Silent
        }
      };

      // Check if a nickname is banned
      window.fbCheckBanned = async (nickname) => {
        const key = nickKey(nickname);
        if (!key) return false;
        try {
          const snap = await getDoc(doc(db, 'chatBans', key));
          return snap.exists();
        } catch (err) {
          return false;
        }
      };

      // Periodic "heartbeat" to keep nickname reservation fresh
      window.fbHeartbeat = async (nickname, userId) => {
        const key = nickKey(nickname);
        if (!key) return;
        try {
          await setDoc(doc(db, 'chatNicknames', key), {
            nickname: nickname.trim(),
            userId: userId,
            lastSeenAt: serverTimestamp()
          }, { merge: true });
        } catch (err) {
          // Silent
        }
      };

      // Subscribe to online users list (real-time)
      window.fbSubscribeOnline = (callback) => {
        const q = query(collection(db, 'chatNicknames'));
        return onSnapshot(q, (snapshot) => {
          const cutoff = Date.now() - 90 * 1000; // 90 sec stale window
          const users = snapshot.docs
            .map(d => Object.assign({}, d.data(), { _id: d.id }))
            .filter(u => u.lastSeenAt && u.lastSeenAt.seconds && (u.lastSeenAt.seconds * 1000) > cutoff);
          callback(users);
        }, (err) => {
          log('❌ fbSubscribeOnline err: ' + err.message, 'err');
        });
      };

      // Subscribe to pinned message (admin can pin one message for everyone)
      window.fbSubscribePinned = (callback) => {
        return onSnapshot(doc(db, 'chatPinned', 'current'), (snap) => {
          callback(snap.exists() ? snap.data() : null);
        }, (err) => {
          log('❌ fbSubscribePinned err: ' + err.message, 'err');
        });
      };

      // Send a private message
      window.fbSendPrivate = async (msg) => {
        const payload = Object.assign({}, msg, { createdAt: serverTimestamp() });
        return await addDoc(collection(db, 'chatPrivateMessages'), payload);
      };

      // Subscribe to private messages for current user (both sent + received)
      window.fbSubscribePrivate = (nickname, callback) => {
        // Listen to messages where this user is sender OR receiver.
        // Firestore doesn't allow OR queries on different fields, so we run 2 and merge.
        const qTo = query(collection(db, 'chatPrivateMessages'), where('to', '==', nickname), limit(500));
        const qFrom = query(collection(db, 'chatPrivateMessages'), where('from', '==', nickname), limit(500));
        let toMsgs = [], fromMsgs = [];
        const merge = () => {
          const all = [...toMsgs, ...fromMsgs];
          // Deduplicate by firestore ID (though a message only matches one direction)
          const seen = {};
          const deduped = all.filter(m => { if (seen[m._firestoreId]) return false; seen[m._firestoreId] = true; return true; });
          deduped.sort((a, b) => {
            const aT = a.createdAt && a.createdAt.seconds ? a.createdAt.seconds : 0;
            const bT = b.createdAt && b.createdAt.seconds ? b.createdAt.seconds : 0;
            return aT - bT;
          });
          callback(deduped);
        };
        const u1 = onSnapshot(qTo, (snap) => {
          toMsgs = snap.docs.map(d => Object.assign({}, d.data(), { _firestoreId: d.id }));
          merge();
        }, (err) => log('❌ private(to): ' + err.message, 'err'));
        const u2 = onSnapshot(qFrom, (snap) => {
          fromMsgs = snap.docs.map(d => Object.assign({}, d.data(), { _firestoreId: d.id }));
          merge();
        }, (err) => log('❌ private(from): ' + err.message, 'err'));
        return () => { u1(); u2(); };
      };

      window.fbSubscribeToRoom = (roomName, callback) => {
        log('👂 מאזין להודעות בחדר: "' + roomName + '"', 'info');
        // NOTE: We intentionally do NOT use orderBy() here because that would
        // require a composite index. Instead we fetch by room only and sort
        // client-side. This keeps Firestore happy with a single-field index
        // (which is automatic).
        const q = query(
          collection(db, 'chatMessages'),
          where('room', '==', roomName),
          limit(200)
        );
        return onSnapshot(q, (snapshot) => {
          const msgs = snapshot.docs.map(d => {
            const data = d.data();
            return Object.assign({}, data, { _firestoreId: d.id });
          });
          // Sort oldest → newest by createdAt timestamp (missing values go last)
          msgs.sort((a, b) => {
            const aT = a.createdAt && a.createdAt.seconds ? a.createdAt.seconds : 0;
            const bT = b.createdAt && b.createdAt.seconds ? b.createdAt.seconds : 0;
            return aT - bT;
          });
          log('📥 קיבלתי ' + msgs.length + ' הודעות מהחדר "' + roomName + '"', 'ok');
          callback(msgs);
        }, (err) => {
          log('❌ שגיאת האזנה: [' + (err.code || '?') + '] ' + err.message, 'err');
          if (err.code === 'permission-denied') {
            log('   → עדכן את חוקי האבטחה ב-Firebase Console!', 'err');
          }
        });
      };

      window.firebaseReady = true;
      window.dispatchEvent(new Event('firebase-ready'));
      log('🔥 Firebase מוכן - הצ\'אט מחובר!', 'ok');
    } catch (initErr) {
      log('💥 שגיאה קריטית באתחול Firebase: ' + initErr.message, 'err');
      console.error('[Firebase] Init failed:', initErr);
    }
  </script>
