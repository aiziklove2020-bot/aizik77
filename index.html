  <script>
    // Debug logger — only active when ?debug is in URL
    (function() {
      const urlParams = new URLSearchParams(window.location.search);
      const debugMode = urlParams.has('debug');
      if (debugMode) {
        document.getElementById('debug-toggle').classList.add('visible');
        document.getElementById('debug-panel').classList.add('visible');
      }
      window.__debugLog = function(msg, type) {
        type = type || 'info';
        const panel = document.getElementById('debug-panel');
        if (!panel) return;
        const line = document.createElement('div');
        line.className = 'line ' + type;
        const time = new Date().toLocaleTimeString('en-GB');
        line.textContent = '[' + time + '] ' + msg;
        panel.appendChild(line);
        panel.scrollTop = panel.scrollHeight;
        // Also log to console
        console.log('[DEBUG]', msg);
      };
      // Catch all unhandled errors
      window.addEventListener('error', function(e) {
        window.__debugLog('💥 שגיאה לא-מטופלת: ' + (e.message || e.error), 'err');
      });
      window.addEventListener('unhandledrejection', function(e) {
        const msg = e.reason && e.reason.message ? e.reason.message : String(e.reason);
        window.__debugLog('💥 Promise rejected: ' + msg, 'err');
      });
    })();
  </script>

  <script type="module">
    const log = (m, t) => window.__debugLog && window.__debugLog(m, t);

    try {
      log('⏳ טוען את Firebase SDK...', 'info');
      const { initializeApp } =
        await import('https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js');
      const {
        getFirestore, collection, addDoc, query, where, orderBy,

      } = await import('https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js');

      const firebaseConfig = {

      log('ℹ️ משתמש ב-chatMessages collection (לא מתנגש באתר קיים)', 'info');

      // Expose helpers
      window.fbSendMessage = async (msg) => {
        const payload = Object.assign({}, msg, { createdAt: serverTimestamp() });
        log('📤 fbSendMessage → collection(chatMessages).add()', 'info');
        return await addDoc(collection(db, 'chatMessages'), payload);
      };

      window.fbDeleteMessage = async (firestoreId) => {
        return await deleteDoc(doc(db, 'chatMessages', firestoreId));
      };

      // Normalize nickname for use as document ID (Firestore forbids '/')
      const nickKey = (nick) => String(nick).trim().toLowerCase().replace(/[\/\\\s\.\#\$\[\]]/g, '_');

      // Claim a nickname. Returns {ok:true, userId} on success, {ok:false, reason:'taken'|'banned'} on failure.
      window.fbClaimNickname = async (nickname) => {
        const key = nickKey(nickname);
        if (!key) return { ok: false, reason: 'invalid' };

        // Reserved admin nicknames — only accessible via /admin panel
        const RESERVED_ADMIN_NICKS = ['aizik_love', 'miss_chen', 'aizik love', 'miss chen'];
        const normalizedNick = nickname.trim().toLowerCase();
        if (RESERVED_ADMIN_NICKS.includes(normalizedNick) || RESERVED_ADMIN_NICKS.includes(key)) {
          return { ok: false, reason: 'reserved' };
        }

        try {
          // Check ban list first
          const banRef = doc(db, 'chatBans', key);
          const banSnap = await getDoc(banRef);
          if (banSnap.exists()) return { ok: false, reason: 'banned' };

          // Check if nickname is already claimed
          const nickRef = doc(db, 'chatNicknames', key);
          const nickSnap = await getDoc(nickRef);
          if (nickSnap.exists()) {
            const data = nickSnap.data();
            // If last seen within 60 seconds, it's still "online" → taken.
            // Otherwise allow reclaim (covers users closing tab without logout).
            const lastAt = data.lastSeenAt && data.lastSeenAt.seconds ? data.lastSeenAt.seconds * 1000 : 0;
            if (Date.now() - lastAt < 60 * 1000) {
              return { ok: false, reason: 'taken' };
            }
          }

          const userId = 'u_' + Date.now() + '_' + Math.floor(Math.random() * 10000);
          await setDoc(nickRef, {
            nickname: nickname.trim(),
            userId: userId,
            claimedAt: serverTimestamp(),
            lastSeenAt: serverTimestamp()
          });
          log('✅ כינוי "' + nickname + '" נתפס (userId=' + userId + ')', 'ok');
          return { ok: true, userId: userId };
        } catch (err) {
          log('❌ fbClaimNickname error: ' + err.message, 'err');
          return { ok: false, reason: err.message };
        }
      };

      window.fbReclaimNickname = async (nickname, userId) => {
        const key = nickKey(nickname);
        if (!key) return {ok:false};
        try {
          const nickRef = doc(db,'chatNicknames',key);
          const snap = await getDoc(nickRef);
          if (snap.exists()) {
            const data = snap.data();
            if (data.userId===userId) { await setDoc(nickRef,{nickname:nickname.trim(),userId,lastSeenAt:serverTimestamp()},{merge:true}); return {ok:true,userId}; }
            const lastAt = data.lastSeenAt?.seconds?data.lastSeenAt.seconds*1000:0;
            if (Date.now()-lastAt>60000) { await setDoc(nickRef,{nickname:nickname.trim(),userId,lastSeenAt:serverTimestamp()},{merge:true}); return {ok:true,userId}; }
            return {ok:false,reason:'taken'};
          }
          await setDoc(nickRef,{nickname:nickname.trim(),userId,lastSeenAt:serverTimestamp()});
          return {ok:true,userId};
        } catch(e) { return {ok:false,reason:e.message}; }
      };

      // Admin-only: claim a reserved admin nickname (bypasses the reserved check)
      window.fbClaimAdminNickname = async (nickname) => {
        const key = nickKey(nickname);
        if (!key) return { ok: false, reason: 'invalid' };
        try {

            nickname: nickname.trim(),
            userId: userId,
            isAdmin: true,
            claimedAt: serverTimestamp(),
            lastSeenAt: serverTimestamp()
          });
          return { ok: true, userId: userId };
        } catch (err) {
          return { ok: false, reason: err.message };
        }
      };

      // Release a nickname (called on logout)
      window.fbReleaseNickname = async (nickname, userId) => {
        const key = nickKey(nickname);
        if (!key) return;
        try {
          // Only release if we own it (matching userId)
          const nickRef = doc(db, 'chatNicknames', key);
          const snap = await getDoc(nickRef);
          if (snap.exists() && snap.data().userId === userId) {
            await deleteDoc(nickRef);
            log('🚪 כינוי "' + nickname + '" שוחרר', 'info');
          }

          // Silent

      window.fbSubscribeOnline = (callback) => {
        const q = query(collection(db, 'chatNicknames'));
        return onSnapshot(q, (snapshot) => {
          const cutoff = Date.now() - 45 * 1000;
          const users = snapshot.docs
            .map(d => Object.assign({}, d.data(), { _id: d.id }))
            .filter(u => u.lastSeenAt && u.lastSeenAt.seconds && (u.lastSeenAt.seconds * 1000) > cutoff);

          log('❌ fbSubscribeOnline err: ' + err.message, 'err');

      // Subscribe to pinned message (admin can pin one message for everyone)
      window.fbSubscribeRooms = (callback) => {
        return onSnapshot(collection(db, 'chatRooms'), (snap) => {
          var rooms = snap.docs.map(d => Object.assign({}, d.data(), {_id: d.id}));
          rooms.sort((a,b) => (a.order||99)-(b.order||99));
          callback(rooms);
        }, () => callback([]));
      };
      window.fbSubscribeParty = (callback) => {
        return onSnapshot(doc(db, 'chatSettings', 'party'), (snap) => {
          callback(snap.exists() ? snap.data() : null);
        }, () => callback(null));
      };
      window.fbSubscribePinned = (callback) => {
        return onSnapshot(doc(db, 'chatPinned', 'current'), (snap) => {
          callback(snap.exists() ? snap.data() : null);
        }, (err) => {
          log('❌ fbSubscribePinned err: ' + err.message, 'err');

      // Send a private message

      // Subscribe to private messages for current user (both sent + received)

        // Listen to messages where this user is sender OR receiver.
        // Firestore doesn't allow OR queries on different fields, so we run 2 and merge.
        const qTo = query(collection(db, 'chatPrivateMessages'), where('to', '==', nickname), limit(500));
        const qFrom = query(collection(db, 'chatPrivateMessages'), where('from', '==', nickname), limit(500));
        let toMsgs = [], fromMsgs = [];
        const merge = () => {
          const all = [...toMsgs, ...fromMsgs];
          // Deduplicate by firestore ID (though a message only matches one direction)
          const seen = {};
          const deduped = all.filter(m => { if (seen[m._firestoreId]) return false; seen[m._firestoreId] = true; return true; });
          deduped.sort((a, b) => {
            const aT = a.createdAt && a.createdAt.seconds ? a.createdAt.seconds : 0;
            const bT = b.createdAt && b.createdAt.seconds ? b.createdAt.seconds : 0;
            return aT - bT;
          });
          callback(deduped);
        };
        const u1 = onSnapshot(qTo, (snap) => {
          toMsgs = snap.docs.map(d => Object.assign({}, d.data(), { _firestoreId: d.id }));

        }, (err) => log('❌ private(to): ' + err.message, 'err'));

        return () => { u1(); u2(); };

        const q = query(

          if (err.code === 'permission-denied') {

          }
        });
      };

    try {
      if (!window.__audioCtx) window.__audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      var ctx = window.__audioCtx;
      if (ctx.state === 'suspended') ctx.resume();
      var osc = ctx.createOscillator();
      var gain = ctx.createGain();
      osc.connect(gain); gain.connect(ctx.destination);

        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.3);
        osc.start(ctx.currentTime); osc.stop(ctx.currentTime + 0.3);
      }
    } catch(e) {}
  };
